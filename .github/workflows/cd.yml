name: .NET Web APP CD

on:
  workflow_run:
    workflows: [".NET Web APP CI"] 
    types:
      - completed
    branches: 
      - master
      - azure/migration 

jobs:
  deploy-to-azure-webapp:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest 

    steps:
    - name: Download Artifact from CI
      uses: actions/download-artifact@v4
      with:
        name: web-api-drop
        path: ./publish
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'storeApp' 
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: './publish'

    - name: Verify Live Health Check
      shell: bash
      run: |
        echo "Waiting 15 seconds for Azure App Service to restart..."
        sleep 15

        APP_URL="https://storeapp-djgjghawfsdxb3en.polandcentral-01.azurewebsites.net/health/live"
        echo "Pinging Health Check: $APP_URL"

        for i in {1..5}; do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL")
          if [ "$STATUS" -eq 200 ]; then
            echo "Deployment succeeded! API is healthy (HTTP 200)."
            exit 0
          fi
          echo "Attempt $i: Received HTTP $STATUS. Retrying in 5s..."
          sleep 5
        done

        echo "Health check failed after 5 attempts!"
        exit 1